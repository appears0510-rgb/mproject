name: 新着収益物件チェック

on:
  schedule:
    # 毎時17分（JST 7:17〜23:17 のみ）。UTC表記なので -9時間
    - cron: "17 22-23,0-14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "通知せずログに表示だけする"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: property-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: property-watcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: property-watcher/requirements.txt
      - run: pip install -r requirements.txt
      - name: 巡回して通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python watcher.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: 既読状態を保存
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "property-watcher: update seen listings"
            git push
          fi
