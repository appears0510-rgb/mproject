<title>物件情報台帳</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: 受付→進捗ボード（横スクロール列）→詳細ダイアログ（資料・原文→その場で書ける物件概要書）。社内ツール群と同じトークン。 */
  :root{
    --bg:#ece7de; --bg-elevated:#f7f4ee; --bg-sunk:#e2ddd2;
    --ink:#1b2023; --ink-soft:#4b5459; --ink-faint:#7c8388;
    --accent:#1f6f6b; --accent-ink:#f7f4ee; --accent-soft:#e3ede9; --accent-2:#b5573c;
    --line:rgba(27,32,35,0.14); --line-strong:rgba(27,32,35,0.28);
    --danger:#b5573c; --ai:#6a4c9c;
    --s-new:#2f6fb0; --s-review:#8a6a12; --s-intro:#1f6f6b; --s-nego:#b5573c;
    --s-contract:#6a4c9c; --s-closed:#3d7a3a; --s-drop:#7c8388;
    /* 物件概要書は紙として常に明るい配色 */
    --paper:#ffffff; --sheet-ink:#15191b; --sheet-rule:#15191b; --sheet-head:#dcebf2;
    --sheet-hover:#eef5f9; --sheet-focus:#1f6f6b; --sheet-red:#c62f1f; --sheet-ai:#efe9f8; --sheet-muted:#6b7478;
    --font-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12171a; --bg-elevated:#1a2124; --bg-sunk:#0d1113;
      --ink:#ece7de; --ink-soft:#a9b2b4; --ink-faint:#727c7e;
      --accent:#4fbdb6; --accent-ink:#0e1516; --accent-soft:#1c2d2c; --accent-2:#d97c5d;
      --line:rgba(236,231,222,0.14); --line-strong:rgba(236,231,222,0.28);
      --danger:#e08a6e; --ai:#b39ae0;
      --s-new:#7fb2e8; --s-review:#d9b55a; --s-intro:#4fbdb6; --s-nego:#e08a6e;
      --s-contract:#b39ae0; --s-closed:#8cc587; --s-drop:#8f989a;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12171a; --bg-elevated:#1a2124; --bg-sunk:#0d1113;
    --ink:#ece7de; --ink-soft:#a9b2b4; --ink-faint:#727c7e;
    --accent:#4fbdb6; --accent-ink:#0e1516; --accent-soft:#1c2d2c; --accent-2:#d97c5d;
    --line:rgba(236,231,222,0.14); --line-strong:rgba(236,231,222,0.28);
    --danger:#e08a6e; --ai:#b39ae0;
    --s-new:#7fb2e8; --s-review:#d9b55a; --s-intro:#4fbdb6; --s-nego:#e08a6e;
    --s-contract:#b39ae0; --s-closed:#8cc587; --s-drop:#8f989a;
    color-scheme:dark;
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.65; padding-bottom:64px; }
  .wrap{ max-width:1320px; margin:0 auto; padding-inline:16px; }
  @media (min-width:720px){ .wrap{ padding-inline:28px; } }
  h1,h2,h3{ font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; }
  .tnum{ font-variant-numeric:tabular-nums; }

  header.top{ background:var(--bg-elevated); border-bottom:1px solid var(--line); padding-block:14px; margin-bottom:20px; }
  header.top .wrap{ display:flex; align-items:center; gap:12px 16px; flex-wrap:wrap; }
  header.top h1{ font-size:1.35rem; letter-spacing:0.04em; }
  .mode{ font-size:0.7rem; color:var(--ink-faint); border:1px solid var(--line); background:var(--bg-sunk); border-radius:99px; padding:2px 10px; }
  .spacer{ flex:1; }

  label{ display:block; font-size:0.72rem; color:var(--ink-soft); margin-bottom:3px; letter-spacing:0.03em; }
  input[type=text], input[type=date], input[type=search], select, textarea{
    width:100%; font:inherit; font-size:0.88rem; color:var(--ink); background:var(--bg);
    border:1px solid var(--line-strong); border-radius:8px; padding:8px 10px;
  }
  textarea{ resize:vertical; line-height:1.55; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .card:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  button{ font:inherit; font-weight:700; font-size:0.82rem; border-radius:8px; border:1px solid var(--line-strong); background:var(--bg); color:var(--ink); padding:8px 14px; cursor:pointer; white-space:nowrap; }
  button:hover{ border-color:var(--accent); color:var(--accent); }
  button.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  button.primary:hover{ opacity:0.9; color:var(--accent-ink); }
  button.ai{ background:transparent; color:var(--ai); border-color:var(--ai); }
  button.ai:hover{ background:var(--ai); color:var(--bg-elevated); }
  button.danger{ color:var(--danger); border-color:var(--danger); background:transparent; }
  button.small{ padding:4px 10px; font-size:0.74rem; }
  button:disabled{ opacity:0.45; cursor:not-allowed; }

  .summary{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; margin-bottom:16px; }
  .tile{ text-align:left; display:flex; flex-direction:column; gap:2px; padding:10px 12px; border-radius:10px; background:var(--bg-elevated); border:1px solid var(--line); border-top:3px solid var(--s); }
  .tile .lab{ font-size:0.72rem; color:var(--ink-soft); font-weight:500; }
  .tile .num{ font-family:var(--font-display); font-size:1.5rem; line-height:1.1; color:var(--ink); }
  .tile[aria-pressed="true"]{ background:color-mix(in srgb, var(--s) 12%, var(--bg-elevated)); border-color:var(--s); }
  .tile.alert .num{ color:var(--danger); }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .toolbar input[type=search]{ flex:1 1 220px; min-width:0; }
  .toolbar select{ width:auto; flex:0 0 auto; }
  .seg{ display:inline-flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; }
  .seg button{ border:0; border-radius:0; background:transparent; }
  .seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }

  .board{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(230px,1fr); gap:10px; overflow-x:auto; padding-bottom:8px; align-items:start; }
  .col{ background:var(--bg-sunk); border-radius:12px; padding:8px; min-height:120px; display:flex; flex-direction:column; gap:8px; }
  .col.drop-on{ outline:2px dashed var(--s); outline-offset:-2px; }
  .col-head{ display:flex; align-items:center; gap:8px; padding:4px 4px 2px; font-weight:700; font-size:0.84rem; }
  .col-head::before{ content:""; width:9px; height:9px; border-radius:50%; background:var(--s); }
  .col-head .c{ margin-left:auto; color:var(--ink-faint); font-weight:500; font-size:0.78rem; }
  .col-empty{ font-size:0.75rem; color:var(--ink-faint); padding:10px 6px; text-align:center; border:1px dashed var(--line-strong); border-radius:8px; }
  .card{ background:var(--bg-elevated); border:1px solid var(--line); border-radius:9px; padding:10px 11px; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
  .card:hover{ border-color:var(--line-strong); }
  .card.dragging{ opacity:0.4; }
  .card-top{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .card h3{ font-family:var(--font-body); font-size:0.9rem; font-weight:700; line-height:1.4; overflow-wrap:anywhere; }
  .card .addr{ font-size:0.75rem; color:var(--ink-soft); margin:0; overflow-wrap:anywhere; }
  .card-foot{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; margin-top:2px; }
  .price{ font-family:var(--font-display); font-weight:700; font-size:1rem; }
  .yield{ font-size:0.72rem; color:var(--ink-soft); margin-left:4px; font-family:var(--font-body); font-weight:500; }
  .due{ font-size:0.72rem; color:var(--ink-soft); }
  .due.over{ color:var(--danger); font-weight:700; }
  .due.today{ color:var(--s-review); font-weight:700; }
  .chip{ display:inline-block; font-size:0.66rem; font-weight:700; letter-spacing:0.04em; padding:1px 8px; border-radius:99px; background:var(--bg-sunk); color:var(--ink-soft); white-space:nowrap; }
  .chip.st{ background:color-mix(in srgb, var(--s) 15%, transparent); color:var(--s); }
  .chip.outline{ background:transparent; border:1px solid var(--line); }

  .list-wrap{ overflow-x:auto; background:var(--bg-elevated); border:1px solid var(--line); border-radius:12px; }
  .list-wrap table{ width:100%; border-collapse:collapse; font-size:0.82rem; }
  .list-wrap th{ text-align:left; font-size:0.7rem; color:var(--ink-soft); font-weight:700; letter-spacing:0.04em; padding:8px 10px; border-bottom:1px solid var(--line-strong); white-space:nowrap; }
  .list-wrap td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .list-wrap tbody tr{ cursor:pointer; }
  .list-wrap tbody tr:hover{ background:var(--bg-sunk); }

  .empty{ text-align:center; padding:48px 16px; color:var(--ink-soft); background:var(--bg-elevated); border:1px dashed var(--line-strong); border-radius:12px; }
  .empty h2{ font-size:1.1rem; margin-bottom:6px; color:var(--ink); }

  dialog{ border:0; padding:0; border-radius:14px; background:var(--bg-elevated); color:var(--ink); width:min(1100px, calc(100vw - 20px)); max-height:calc(100dvh - 24px); box-shadow:0 30px 80px -30px rgba(0,0,0,0.5); }
  dialog.narrow{ width:min(620px, calc(100vw - 20px)); }
  dialog::backdrop{ background:rgba(10,14,16,0.55); }
  .dlg{ display:flex; flex-direction:column; max-height:calc(100dvh - 24px); }
  .dlg-head{ display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); }
  .dlg-head h2{ font-size:1.1rem; flex:1; min-width:0; }
  .dlg-body{ padding:16px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; }
  .dlg-body > *{ flex-shrink:0; }
  .dlg-foot{ display:flex; gap:8px; align-items:center; padding:12px 18px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .x{ border:0; background:transparent; font-size:1.3rem; line-height:1; padding:4px 8px; }

  .grid{ display:grid; gap:10px 12px; }
  .g3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  @media (max-width:760px){ .g3{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:460px){ .g3{ grid-template-columns:1fr; } }
  .span2{ grid-column:span 2; }
  @media (max-width:460px){ .span2{ grid-column:auto; } }

  .split{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:start; }
  @media (max-width:760px){ .split{ grid-template-columns:1fr; } }
  .section-lab{ font-size:0.72rem; font-weight:700; letter-spacing:0.12em; color:var(--ink-faint); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .section-lab::after{ content:""; flex:1; height:1px; background:var(--line); }
  .map-row{ display:flex; gap:8px 10px; align-items:center; flex-wrap:wrap; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  .map-row .where{ flex:1 1 220px; min-width:0; font-size:0.86rem; overflow-wrap:anywhere; }
  .map-row .where small{ display:block; font-size:0.7rem; color:var(--ink-faint); }
  .map-row .pin{ flex:1 1 100%; display:flex; gap:8px; align-items:center; }
  .map-row .pin label{ margin:0; white-space:nowrap; }
  .map-row .pin input{ flex:1; min-width:0; padding:6px 8px; font-size:0.8rem; }
  a.btn{ display:inline-flex; align-items:center; gap:4px; font-weight:700; font-size:0.74rem; border-radius:8px; border:1px solid var(--line-strong); background:var(--bg-elevated); color:var(--ink); padding:4px 10px; text-decoration:none; white-space:nowrap; }
  a.btn:hover{ border-color:var(--accent); color:var(--accent); }
  a.btn.off{ opacity:0.45; pointer-events:none; }
  a.maplink{ font-size:0.72rem; color:var(--accent); text-decoration:none; font-weight:700; white-space:nowrap; }
  a.maplink:hover{ text-decoration:underline; }
  .sheet-bar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sheet-bar .section-lab{ flex:1 1 200px; margin:0; }

  .drop{ border:2px dashed var(--line-strong); border-radius:12px; padding:22px 14px; text-align:center; color:var(--ink-soft); font-size:0.84rem; background:var(--bg); cursor:pointer; }
  .drop.on{ border-color:var(--accent); background:var(--accent-soft); }
  .drop strong{ display:block; color:var(--ink); font-size:0.95rem; margin-bottom:2px; }
  .pending{ display:flex; flex-wrap:wrap; gap:6px; }
  .pending .chip{ font-size:0.72rem; }

  .files{ display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
  .file{ position:relative; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--bg); aspect-ratio:3/4; max-width:100%; display:flex; flex-direction:column; text-decoration:none; color:inherit; }
  .file img{ width:100%; height:100%; object-fit:cover; }
  .file .pdf{ flex:1; display:grid; place-items:center; font-family:var(--font-display); font-weight:700; color:var(--accent-2); font-size:1.1rem; }
  .file .nm{ position:absolute; left:0; right:0; bottom:0; font-size:0.62rem; padding:2px 5px; background:color-mix(in srgb, var(--bg-elevated) 88%, transparent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ai-bar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .ai-msg{ font-size:0.78rem; color:var(--ink-soft); margin:0; }
  .ai-msg.err{ color:var(--danger); }

  .hist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:0.8rem; }
  .hist li{ display:flex; gap:10px; }
  .hist time{ color:var(--ink-faint); white-space:nowrap; font-size:0.74rem; padding-top:1px; }
  .note-row{ display:flex; gap:8px; margin-top:8px; }
  .note-row input{ flex:1; min-width:0; }

  /* ===== 物件概要書 ===== */
  .sheet-scroll{ overflow-x:auto; border-radius:6px; }
  .sheet{ background:var(--paper); color:var(--sheet-ink); color-scheme:light; padding:20px 22px 16px; min-width:700px; font-family:var(--font-display); font-weight:500; box-shadow:0 1px 0 var(--line), 0 12px 30px -20px rgba(0,0,0,0.4); }
  .s-title{ border:3px solid var(--sheet-rule); background:var(--sheet-head); text-align:center; font-size:1.7rem; font-weight:600; letter-spacing:0.7em; padding:6px 0 6px 0.7em; margin-bottom:14px; }
  table.gaiyo{ width:100%; border-collapse:collapse; table-layout:fixed; border:3px solid var(--sheet-rule); font-size:0.9rem; line-height:1.45; }
  .gaiyo th, .gaiyo td{ border:1px solid var(--sheet-rule); padding:3px 6px; height:2em; color:var(--sheet-ink); font-weight:500; }
  .gaiyo th{ background:var(--sheet-head); text-align:center; white-space:nowrap; letter-spacing:0.15em; }
  .gaiyo th.sec{ font-size:1.05rem; letter-spacing:0.6em; border-right-width:3px; border-bottom-width:3px; border-top-width:3px; }
  .gaiyo th.sub{ letter-spacing:0; font-size:0.84rem; }
  .gaiyo td{ text-align:center; }
  .gaiyo td.l{ text-align:left; }
  .gaiyo tr.band > *{ border-top-width:3px; }
  .gaiyo .big{ font-size:1.2rem; }
  .gaiyo .unit{ color:var(--sheet-muted); font-size:0.82em; margin-inline:0.35em; white-space:nowrap; }
  .gaiyo input, .gaiyo textarea{ font:inherit; color:inherit; background:transparent; border:0; border-radius:3px; padding:1px 3px; text-align:inherit; width:100%; min-width:0; }
  .gaiyo input.i{ display:inline-block; vertical-align:baseline; }
  .gaiyo input:hover, .gaiyo textarea:hover{ background:var(--sheet-hover); }
  .gaiyo input:focus, .gaiyo textarea:focus{ outline:2px solid var(--sheet-focus); outline-offset:0; background:var(--paper); }
  .gaiyo input::placeholder, .gaiyo textarea::placeholder{ color:#b3b9bc; }
  .gaiyo textarea{ resize:vertical; text-align:left; line-height:1.7; }
  .gaiyo .ai-filled{ background:var(--sheet-ai); box-shadow:inset 0 -2px 0 var(--ai); }
  .gaiyo .calc:not(:placeholder-shown){ color:var(--sheet-focus); }
  .s-foot{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:0.78rem; margin-top:10px; font-family:var(--font-body); color:var(--sheet-ink); }
  .s-foot b{ font-size:0.95rem; font-family:var(--font-display); }
  .s-foot .muted{ color:var(--sheet-muted); }
  .sheet-hint{ font-size:0.74rem; color:var(--ink-faint); margin:0; }

  .toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg-elevated); padding:10px 18px; border-radius:99px; font-size:0.82rem; opacity:0; pointer-events:none; transition:opacity .2s; max-width:calc(100vw - 32px); z-index:10; }
  .toast.show{ opacity:1; }
  .hint{ font-size:0.76rem; color:var(--ink-faint); margin:0; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <h1>物件情報台帳</h1>
    <span class="mode" id="mode">読み込み中…</span>
    <span class="spacer"></span>
    <button id="btnSettings" class="small">会社情報</button>
    <button id="btnIntake" class="primary">＋ 物件資料を取り込む</button>
  </div>
</header>

<div class="wrap">
  <section class="summary" id="summary" aria-label="進捗サマリー"></section>
  <div class="toolbar">
    <input type="search" id="q" placeholder="物件名・所在地・送り元で検索" aria-label="検索">
    <select id="fSource" aria-label="取得元で絞り込み"><option value="">取得元：すべて</option></select>
    <div class="seg" role="group" aria-label="表示切替">
      <button id="vBoard" aria-pressed="true">ボード</button>
      <button id="vList" aria-pressed="false">一覧</button>
    </div>
    <button id="btnCsv" class="small" title="Google マイマップに読み込むと全物件をピンで表示できます">地図用CSVを書き出す</button>
  </div>
  <main id="main"></main>
</div>

<!-- 取込 -->
<dialog id="dlgIntake" class="narrow">
  <form class="dlg" id="intakeForm" method="dialog">
    <div class="dlg-head"><h2>物件資料を取り込む</h2><button type="button" class="x" data-close aria-label="閉じる">×</button></div>
    <div class="dlg-body">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="ファイルを選択">
        <strong>PDF・写真をここにドロップ</strong>
        クリックで選択／スクリーンショットは Ctrl+V で貼り付け
        <input type="file" id="intakeFiles" multiple accept="application/pdf,image/jpeg,image/png,image/webp,image/gif,.pdf,.jpg,.jpeg,.png,.webp" hidden>
      </div>
      <div class="pending" id="pendingFiles"></div>
      <div>
        <label for="intakeText">LINE・メールの本文（コピーして貼り付け）</label>
        <textarea id="intakeText" rows="6" placeholder="例）お世話になります。新規物件のご紹介です。&#10;所在地：福岡市東区香椎駅前2丁目&#10;価格：2,480万円&#10;土地面積：132.5㎡ …"></textarea>
      </div>
      <div class="grid g3">
        <div><label for="intakeSource">取得元</label><select id="intakeSource"></select></div>
        <div><label for="intakeSender">送り元（業者・担当）</label><input type="text" id="intakeSender" placeholder="○○不動産 田中様"></div>
        <div><label for="intakeDate">受領日</label><input type="date" id="intakeDate"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;font-size:0.82rem;color:var(--ink)" id="intakeAiWrap"><input type="checkbox" id="intakeAi" checked> 取り込み後、AIで物件概要書に読み取る</label>
      <p class="hint" id="intakeHint"></p>
    </div>
    <div class="dlg-foot">
      <span class="ai-msg" id="intakeMsg"></span>
      <span class="spacer"></span>
      <button type="button" data-close>キャンセル</button>
      <button type="submit" class="primary" id="intakeGo">取り込む</button>
    </div>
  </form>
</dialog>

<!-- 詳細 -->
<dialog id="dlgDetail">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="dTitle">物件詳細</h2>
      <button type="button" class="x" data-close aria-label="閉じる">×</button>
    </div>
    <div class="dlg-body">
      <div class="grid g3">
        <div><label for="dStatus">進捗</label><select id="dStatus"></select></div>

<script>
(function(){
'use strict';

/* ---------- 定義 ---------- */
const STATUSES = [
  {k:'new',label:'新着'}, {k:'review',label:'精査中'}, {k:'intro',label:'紹介中'}, {k:'nego',label:'商談中'},
  {k:'contract',label:'契約済'}, {k:'closed',label:'決済済'}, {k:'drop',label:'見送り'},
];
const ST = Object.fromEntries(STATUSES.map(s=>[s.k,s]));
const SOURCES = ['LINE','メール','FAX','レインズ','電話・来店','その他'];
const KINDS = ['売土地','売戸建','売マンション','売区分マンション','売アパート','売ビル','売店舗・事務所'];
// 概要書の項目（キー → 表示名）
const LABEL = {
  kind:'種別', name:'物件名', addrDisplay:'住居表示', addrLot:'地番', line:'路線', station:'駅', walk:'徒歩（分）',
  price:'価格', taxNote:'税区分',
  landRegArea:'面積（公簿）', landActArea:'面積（実測）', landCategory:'地目', landCurrent:'土地の現況',
  cityPlan:'都市計画', zoning:'用途地域', coverage:'建ぺい率', far:'容積率', rights:'権利内容', shape:'形状', legalLimits:'その他法令上の制限',
  structure:'構造規模', floorArea:'延床面積', built:'竣工年月', use:'用途', units:'総戸数', bldCurrent:'建物の現況',
  designer:'設計会社', builder:'施工会社', parking:'駐車場', bldOther:'建物その他',
  elec:'電気', gas:'ガス', water:'上下水道', drain:'雑排水', ev:'EV', equipOther:'設備その他',
  landPrice:'土地価格', bldPrice:'建物価格', landEval:'土地評価額', bldEval:'建物評価額',
  rentFull:'満室賃料', rentNow:'現況賃料', yieldFull:'表面利回り（満室）', yieldNow:'表面利回り（現況）',
  propTax:'固都税', mgmtCost:'保守管理費', netFull:'ネット利回り（満室）', netNow:'ネット利回り（現況）',
  occFull:'稼働率（満室時）', occNow:'稼働率（現況）', remarks:'備考', delivCond:'引渡し条件', delivTime:'引渡し時期',
};
const MONEY = new Set(['price','landPrice','bldPrice','landEval','bldEval','rentFull','rentNow','propTax','mgmtCost']);
const CALC = new Set(['yieldFull','yieldNow','netFull','netNow','occFull','occNow']);

/* ---------- 小物 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => ymd(new Date());
const md = s => s ? (+s.slice(5,7))+'/'+(+s.slice(8,10)) : '';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const clone = o => JSON.parse(JSON.stringify(o));
const stamp = () => { const d=new Date(); return ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); };
const zen2han = s => String(s ?? '').replace(/[０-９．，－]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
// 「1億8,500万円」「¥185,000,000」「18500万」→ 数値
function num(s){
  s = zen2han(s).replace(/[,\s¥￥円]/g,'');
  if(!s) return NaN;
  if(/[億万]/.test(s)){
    let t=0, m;
    if((m=s.match(/([\d.]+)億/))) t+=parseFloat(m[1])*1e8;
    if((m=s.match(/(?:億|^)([\d.]+)万/))) t+=parseFloat(m[1])*1e4;
    return t||NaN;
  }
  const m = s.match(/-?[\d.]+/); return m ? parseFloat(m[0]) : NaN;
}
const fmtInt = n => isFinite(n) ? Math.round(n).toLocaleString('ja-JP') : '';
const fmtMoney = s => { const n=num(s); return isFinite(n) ? Math.round(n).toLocaleString('ja-JP') : String(s||''); };
const tsubo = s => { const n=num(s); return isFinite(n)&&n>0 ? (n*0.3025).toFixed(2) : ''; };
const pct = v => isFinite(v) ? v.toFixed(2)+'%' : '';
function man(s){
  const n=num(s); if(!isFinite(n)||n<=0) return '';
  if(n>=1e8){ const r=Math.round((n%1e8)/1e4); return Math.floor(n/1e8)+'億'+(r?r.toLocaleString('ja-JP')+'万':'')+'円'; }
  return Math.round(n/1e4).toLocaleString('ja-JP')+'万円';
}
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function guessType(name){ const e=(name.split('.').pop()||'').toLowerCase(); return {pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif'}[e]||''; }
const OK_TYPES = ['application/pdf','image/jpeg','image/png','image/webp','image/gif'];
function fileType(f){ return OK_TYPES.includes(f.type) ? f.type : guessType(f.name||''); }
const addrOf = f => (f&&(f.addrDisplay||f.addrLot)) || '';
// Googleマップ：ピン位置（URL・緯度経度）＞住居表示＞地番（先頭の1筆）の順で場所を決める
function pinCoords(s){
  s=zen2han(s||''); if(!s) return null;
  const m = s.match(/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/) || s.match(/!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/) || s.match(/(-?\d{1,3}\.\d{3,})\s*[,，、\s]\s*(-?\d{1,3}\.\d{3,})/);
  if(!m) return null;
  const lat=+m[1], lng=+m[2];
  return Math.abs(lat)<=90 && Math.abs(lng)<=180 ? {lat, lng} : null;
}
function mapQuery(p){
  if(!p) return '';
  const c=pinCoords(p.mapPin); if(c) return `${c.lat},${c.lng}`;
  const f=p.f||{};
  if(f.addrDisplay) return f.addrDisplay;
  if(f.addrLot) return f.addrLot.split(/[、,，]/)[0].trim();
  return '';
}
const isUrl = s => /^https?:\/\//.test(s||'');
function mapUrl(p){
  if(isUrl(p.mapPin) && !pinCoords(p.mapPin)) return p.mapPin;   // maps.app.goo.gl などの共有リンクはそのまま
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(mapQuery(p));
}
function routeUrl(p){ return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(mapQuery(p)); }
function displayName(p){ return (p.f&&p.f.name) || addrOf(p.f) || '名称未設定（'+(p.sender||p.source||'')+'）'; }
function dueClass(d){ if(!d) return ''; const t=today(); return d<t?'over':(d===t?'today':''); }

// 初期版の形式で保存されたデータを概要書の項目に寄せる
function migrate(p){
  const f = p.f || (p.f={});
  if(f._v===2) return p;
  const mv=(a,b)=>{ if(f[a]&&!f[b]) f[b]=f[a]; delete f[a]; };
  mv('address','addrDisplay'); mv('access','line'); mv('buildingArea','floorArea'); mv('delivery','delivTime'); mv('current','landCurrent');
  if(f.landArea&&!f.landRegArea){ const n=num(f.landArea); f.landRegArea=isFinite(n)?String(n):f.landArea; } delete f.landArea;
  if(f.road&&!f.roads) f.roads=[{dir:f.road,type:'',width:'',frontage:''}]; delete f.road;
  if(f.price && !/^\d+$/.test(f.price)){ const n=num(f.price); if(isFinite(n)) f.price=String(Math.round(n)); }
  if(f.kind && !/^売/.test(f.kind)) f.kind = {'土地':'売土地','戸建':'売戸建','マンション':'売マンション','収益一棟':'売アパート','店舗・事務所':'売店舗・事務所'}[f.kind]||f.kind;
  const extra=[f.layout&&('間取り：'+f.layout), f.point].filter(Boolean); delete f.layout; delete f.point;
  if(extra.length) f.remarks=[...extra, f.remarks].filter(Boolean).join('\n');
  if(f.dealType && !p.dealType) p.dealType=f.dealType; delete f.dealType;
  f._v=2; return p;
}

/* ---------- 自動計算 ---------- */
function recompute(f){
  const price=num(f.price), rf=num(f.rentFull), rn=num(f.rentNow), tax=num(f.propTax), mg=num(f.mgmtCost);
  const cost=(isFinite(tax)?tax:0)+(isFinite(mg)?mg:0);
  const out={};
  if(price>0 && rf>0) out.yieldFull=pct(rf/price*100);
  if(price>0 && rn>0) out.yieldNow=pct(rn/price*100);
  if(price>0 && rf>0 && cost>0) out.netFull=pct((rf-cost)/price*100);
  if(price>0 && rn>0 && cost>0) out.netNow=pct((rn-cost)/price*100);
  if(rf>0){ out.occFull='100.00%'; if(rn>0) out.occNow=pct(rn/rf*100); }
  Object.assign(f,out);
  return out;
}
function tsuboPrice(f){
  const price=num(f.price), act=num(f.landActArea), reg=num(f.landRegArea);
  const a = act>0 ? act : reg;
  return price>0 && a>0 ? Math.round(price/(a*0.3025)) : NaN;
}

/* ---------- 状態 ---------- */
const S = { items:[], loaded:false, status:null, q:'', source:'', view:'board', settings:{} };
try{ const v=localStorage.getItem('bukken.view'); if(v==='list'||v==='board') S.view=v; }catch(e){}
let store=null, sample=null, imgLimits=null;

/* ---------- 保存先：クラウド（共有） ---------- */
function makeCloud(db, assets){
  const col = db.collection('properties');
  const setDoc = db.doc('settings/main');
  return {
    mode:'cloud', canUpload:!!assets,
    subscribe(cb){
      col.onSnapshot(s=>cb(s.docs.map(d=>migrate(Object.assign(clone(d.data()), {id:d.id})))),
        ()=>toast('データの同期が止まりました。ページを再読み込みしてください'));
      setDoc.onSnapshot(s=>{ S.settings = s.exists ? Object.assign({}, s.data()) : {}; }, ()=>{});
    },
    async save(p){ const b=clone(p); delete b.id; await col.doc(p.id).set(b); },
    async remove(p){
      await col.doc(p.id).delete();
      if(assets) for(const f of p.files||[]){ try{ await assets.delete(f.id); }catch(e){} }
    },
    async upload(file){ const r=await assets.upload(file, {type:fileType(file)}); return {id:r.id, name:file.name||'image', type:r.contentType, size:r.sizeBytes}; },
    async url(f){ return '/_blob/'+f.id; },
    async blob(f){ const r=await fetch('/_blob/'+f.id); if(!r.ok) throw new Error('missing'); return r.blob(); },
    async saveSettings(s){ await setDoc.set(s); S.settings=s; },
  };
}

/* ---------- 保存先：このブラウザ（IndexedDB） ---------- */
async function makeLocal(){
  let dbp = null;
  try{
    dbp = new Promise((res,rej)=>{
      const r = indexedDB.open('bukken-daicho',1);
      r.onupgradeneeded = ()=>{ const d=r.result; d.createObjectStore('props',{keyPath:'id'}); d.createObjectStore('files',{keyPath:'id'}); };
      r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
    });
    await dbp;
  }catch(e){ dbp = null; }
  const mem = {props:new Map(), files:new Map()};
  const req = (name,mode,fn)=>dbp.then(d=>new Promise((res,rej)=>{
    const t=d.transaction(name,mode); const r=fn(t.objectStore(name));
    t.oncomplete=()=>res(r.result); t.onerror=t.onabort=()=>rej(t.error);
  }));
  const urls = new Map();
  let listener = ()=>{};
  const all = async()=> (dbp ? await req('props','readonly',s=>s.getAll()) : [...mem.props.values()].map(clone)).map(migrate);
  const refresh = ()=>all().then(listener);
  try{ S.settings = JSON.parse(localStorage.getItem('bukken.settings')||'{}'); }catch(e){}
  const api = {
    mode: dbp ? 'local' : 'memory', canUpload:true,
    subscribe(cb){ listener=cb; refresh(); },
    async save(p){ const c=clone(p); if(dbp) await req('props','readwrite',s=>s.put(c)); else mem.props.set(c.id,c); refresh(); },
    async remove(p){
      if(dbp){ await req('props','readwrite',s=>s.delete(p.id)); for(const f of p.files||[]) await req('files','readwrite',s=>s.delete(f.id)); }
      else mem.props.delete(p.id);
      refresh();
    },
    async upload(file){
      const id=uid(); const rec={id, blob:file, name:file.name||'image', type:fileType(file)};
      if(dbp) await req('files','readwrite',s=>s.put(rec)); else mem.files.set(id,rec);
      return {id, name:rec.name, type:rec.type, size:file.size};
    },
    async blob(f){ const r = dbp ? await req('files','readonly',s=>s.get(f.id)) : mem.files.get(f.id); if(!r) throw new Error('missing'); return r.blob; },
    async url(f){ if(!urls.has(f.id)) urls.set(f.id, URL.createObjectURL(await api.blob(f))); return urls.get(f.id); },
    async saveSettings(s){ S.settings=s; try{ localStorage.setItem('bukken.settings', JSON.stringify(s)); }catch(e){} },
  };
  return api;
}

/* ---------- 一覧描画 ---------- */
function filtered(){
  const q = S.q.trim().toLowerCase();
  return S.items.filter(p=>{
    if(S.source && p.source!==S.source) return false;
    if(!q) return true;
    const f=p.f||{};
    return [displayName(p), f.addrDisplay, f.addrLot, f.station, p.sender, p.assignee, f.kind, p.next].join(' ').toLowerCase().includes(q);
  }).sort((a,b)=>{
    const ad=a.nextDate||'9999', bd=b.nextDate||'9999';
    if(ad!==bd) return ad<bd?-1:1;
    return (b.receivedAt||'').localeCompare(a.receivedAt||'');
  });
}
function renderSummary(){
  const counts = Object.fromEntries(STATUSES.map(s=>[s.k,0]));
  let due = 0; const t = today();
  for(const p of S.items){ counts[p.status]=(counts[p.status]||0)+1; if(p.nextDate && p.nextDate<=t && !['closed','drop'].includes(p.status)) due++; }
  $('#summary').innerHTML = STATUSES.map(s=>
    `<button class="tile" style="--s:var(--s-${s.k})" data-st="${s.k}" aria-pressed="${S.status===s.k}"><span class="lab">${s.label}</span><span class="num tnum">${counts[s.k]||0}</span></button>`
  ).join('') + `<button class="tile ${due?'alert':''}" style="--s:var(--danger)" data-st="__due" aria-pressed="${S.status==='__due'}"><span class="lab">期日到来・超過</span><span class="num tnum">${due}</span></button>`;
}
function card(p){
  const f=p.f||{}, nfiles=(p.files||[]).length, pr=man(f.price);
  return `<article class="card" draggable="true" tabindex="0" data-id="${esc(p.id)}">
    <div class="card-top"><span class="chip">${esc(p.source||'—')}</span>${f.kind?`<span class="chip outline">${esc(f.kind)}</span>`:''}${nfiles?`<span class="chip outline">資料${nfiles}</span>`:''}</div>
    <h3>${esc(displayName(p))}</h3>
    ${addrOf(f)&&f.name?`<p class="addr">${esc(addrOf(f))}${f.station?`／${esc(f.station)}駅${f.walk?' 徒歩'+esc(f.walk)+'分':''}`:''}</p>`:''}
    ${mapQuery(p)?`<a class="maplink" href="${esc(mapUrl(p))}" target="_blank" rel="noopener">地図を開く</a>`:''}
    <div class="card-foot"><span class="price tnum">${esc(pr||'価格未定')}${f.yieldFull?`<span class="yield">利回り ${esc(f.yieldFull)}</span>`:''}</span>
    ${p.nextDate||p.next?`<span class="due ${dueClass(p.nextDate)}">${p.nextDate?esc(md(p.nextDate))+' ':''}${esc(p.next||'')}</span>`:(p.assignee?`<span class="due">担当 ${esc(p.assignee)}</span>`:'')}</div>
  </article>`;
}
function renderMain(){
  const main = $('#main');
  if(!S.loaded){ main.innerHTML = `<div class="empty"><h2>読み込み中…</h2></div>`; return; }
  if(!S.items.length){
    main.innerHTML = `<div class="empty"><h2>まだ物件がありません</h2><p>LINEやメールで届いたPDF・写真・本文を「物件資料を取り込む」から登録すると、ここに進捗ごとに並びます。</p><button class="primary" id="emptyIntake">＋ 最初の物件を取り込む</button></div>`;
    $('#emptyIntake').onclick = openIntake; return;
  }
  let items = filtered();
  const t = today();
  if(S.status==='__due') items = items.filter(p=>p.nextDate && p.nextDate<=t && !['closed','drop'].includes(p.status));
  if(S.view==='board' && S.status!=='__due'){
    const cols = S.status ? STATUSES.filter(s=>s.k===S.status) : STATUSES;
    main.innerHTML = `<div class="board">${cols.map(s=>{
      const its = items.filter(p=>(p.status||'new')===s.k);

drop.onclick = ()=>$('#intakeFiles').click();
drop.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('#intakeFiles').click(); } };

drop.addEventListener('drop', e=>addPending([...e.dataTransfer.files]));
$('#dlgIntake').addEventListener('paste', e=>{
  const fs=[...(e.clipboardData&&e.clipboardData.files)||[]];
  if(fs.length){ e.preventDefault(); addPending(fs.map((f,i)=>f.name&&f.name!=='image.png'?f:new File([f], `貼り付け画像${pendingFiles.length+i+1}.png`, {type:f.type||'image/png'}))); }
});
$('#intakeForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const text=$('#intakeText').value.trim(), msg=$('#intakeMsg');
  if(!pendingFiles.length && !text){ msg.textContent='資料か本文のどちらかを入れてください'; msg.className='ai-msg err'; return; }
  $('#intakeGo').disabled=true; msg.className='ai-msg';
  const src=$('#intakeSource').value, sender=$('#intakeSender').value.trim();
  const p = { id:uid(), status:'new', source:src, sender, receivedAt:$('#intakeDate').value||today(), assignee:'', dealType:'',
    next:'', nextDate:'', sourceText:text, files:[], f:{_v:2, roads:[]},
    history:[{at:stamp(), text:`取込（${src}${sender?'・'+sender:''}）`}], createdAt:stamp(), updatedAt:stamp() };
  const failed=[];
  for(let i=0;i<pendingFiles.length;i++){
    msg.textContent = `資料を保存中… ${i+1}/${pendingFiles.length}`;
    try{ p.files.push(await store.upload(pendingFiles[i])); }
    catch(err){ failed.push(pendingFiles[i].name + (err&&err.code==='too_large'?'（20MB超）':'')); }
  }
  if(!sample){ mergeInto(p, extractByLabels(text)); recompute(p.f); }
  try{ await store.save(p); }
  catch(err){ msg.textContent='保存できませんでした。編集権限があるか確認してください'; msg.className='ai-msg err'; $('#intakeGo').disabled=false; return; }
  if(!S.items.find(x=>x.id===p.id)) S.items.push(p);
  const withAi = sample && $('#intakeAi').checked;
  $('#dlgIntake').close();
  if(failed.length) toast('保存できなかった資料：'+failed.join('、'));
  openDetail(p.id, p);
  if(withAi) runAi();
});

function sheetText(){

  L.push(`【物件概要書】${f.name||addrOf(f)}`);
  add('種別',f.kind); add('所在地（住居表示）',f.addrDisplay); add('所在地（地番）',f.addrLot); if(mapQuery(cur)) add('地図',mapUrl(cur));
  if(f.station) add('交通', `${f.line?f.line+' ':''}「${f.station}」駅 徒歩約${f.walk||'?'}分`);
  const tp=tsuboPrice(f);
  if(f.price) add('価格', `¥${fmtMoney(f.price)}${f.taxNote?'（'+f.taxNote+'）':''}${isFinite(tp)?'（坪 ¥'+fmtInt(tp)+'）':''}`);
  L.push('','■土地');
  if(f.landRegArea) add('面積（公簿）', `${f.landRegArea}㎡（${tsubo(f.landRegArea)}坪）`);
  if(f.landActArea) add('面積（実測）', `${f.landActArea}㎡（${tsubo(f.landActArea)}坪）`);
  add('地目',f.landCategory); add('現況',f.landCurrent);
  (f.roads||[]).filter(r=>r&&(r.dir||r.width)).forEach(r=>add('接道', `${r.dir}側 ${r.type} 幅員約${r.width}m 間口約${r.frontage}m`));
  for(const k of ['cityPlan','zoning','coverage','far','rights','shape','legalLimits']) add(LABEL[k],f[k]);
  const bl=['built','use','units','bldCurrent','designer','builder','parking','bldOther'];
  if(f.structure||f.floorArea||bl.some(k=>f[k])){ L.push('','■建物'); add('構造規模',f.structure); if(f.floorArea) add('延床面積',`${f.floorArea}㎡（${tsubo(f.floorArea)}坪）`); for(const k of bl) add(LABEL[k].replace('建物の',''),f[k]); }
  const eq=['elec','gas','water','drain','ev','equipOther'];
  if(eq.some(k=>f[k])){ L.push('','■設備'); for(const k of eq) add(LABEL[k],f[k]); }
  const inc=['landPrice','bldPrice','landEval','bldEval','rentFull','rentNow','yieldFull','yieldNow','propTax','mgmtCost','netFull','netNow','occFull','occNow'];
  if(inc.some(k=>f[k])){ L.push('','■収支（年額）'); for(const k of inc) add(LABEL[k], MONEY.has(k)&&f[k]?'¥'+fmtMoney(f[k]):f[k]); }
  const rem=String(f.remarks||'').split('\n').map(x=>x.trim()).filter(Boolean);
  if(rem.length){ L.push('','■備考'); rem.forEach(r=>L.push(/^※/.test(r)?r:'※'+r)); }
  if(f.delivCond||f.delivTime){ L.push(''); add('引渡し',[f.delivCond,f.delivTime].filter(Boolean).join('／')); }

// res: {kind, name, ..., roads:[{dir,type,width,frontage}], remarks:[..]|"", sender, dealType}
function mergeInto(p, res, marks){
  let n=0; const f=p.f;
  const put=(k,v)=>{
    if(v==null) return; if(Array.isArray(v)) v=v.map(x=>String(x).trim()).filter(Boolean).join('\n');
    v=String(v).trim(); if(!v) return;
    if(MONEY.has(k)){ const x=num(v); if(!isFinite(x)||x<=0) return; v=String(Math.round(x)); }
    if(String(f[k]??'')!==v){ f[k]=v; n++; if(marks) marks.add(k); }
  };
  for(const k of Object.keys(LABEL)) put(k, res[k]);
  if(Array.isArray(res.roads)){
    const rs=res.roads.filter(r=>r&&typeof r==='object').slice(0,3).map(r=>({dir:String(r.dir||''),type:String(r.type||''),width:String(r.width||''),frontage:String(r.frontage||'')}));
    if(rs.length && JSON.stringify(rs)!==JSON.stringify(f.roads||[])){ f.roads=rs; n++; if(marks) rs.forEach((r,i)=>['dir','type','width','frontage'].forEach(x=>r[x]&&marks.add(`roads.${i}.${x}`))); }
  }
  if(res.sender && !p.sender){ p.sender=String(res.sender); n++; }
  if(res.dealType && !p.dealType){ p.dealType=String(res.dealType); n++; }
  return n;
}

}

const LABELS = {
  name:['物件名','名称','マンション名','建物名'], kind:['物件種別','種別','種目'],
  price:['販売価格','売買価格','価格','価額'], addrDisplay:['住居表示','所在地','所在','住所'], addrLot:['地番'],
  landRegArea:['土地面積','敷地面積','地積','公簿'], landActArea:['実測'], landCategory:['地目'],
  cityPlan:['都市計画'], zoning:['用途地域'], coverage:['建ぺい率','建蔽率','建ペい率'], far:['容積率'],
  rights:['権利内容','土地権利','土地の権利','権利'], shape:['形状'], legalLimits:['その他法令上の制限','法令上の制限'],
  structure:['構造規模','構造'], floorArea:['延床面積','延べ床面積','建物面積','専有面積'], built:['竣工年月','新築年月','建築年月','築年月','築年'],
  use:['用途'], units:['総戸数'], parking:['駐車場'], rentFull:['満室賃料','満室想定賃料','満室想定年収'], rentNow:['現況賃料','現行賃料','現況年収'],
  delivCond:['引渡条件','引渡し条件'], delivTime:['引渡時期','引渡し時期','引き渡し','引渡し','引渡'], dealType:['取引態様','態様'],
};
const NUMERIC = ['landRegArea','landActArea','floorArea'];
function extractByLabels(text){
  const out={}; if(!text) return out;
  const lines=zen2han(text).split(/\r?\n/).map(l=>l.trim().replace(/^[■◆●◇○・\-\s【［\[<＜]+/,''));
  for(const [k,labs] of Object.entries(LABELS)){
    outer: for(const line of lines){
      for(const l of labs){
        if(line.startsWith(l) && /^([】］\]>＞\s:：=＝]|$)/.test(line.slice(l.length))){
          const rest=line.slice(l.length).replace(/^[】］\]>＞\s:：=＝]+/,'').trim();
          if(rest){ out[k]=rest; break outer; }
        }
      }
    }
  }
  for(const k of NUMERIC){ if(out[k]){ const m=out[k].match(/[\d,]+(\.\d+)?/); out[k]=m?m[0].replace(/,/g,''):out[k]; } }
  const acc = lines.find(l=>/駅/.test(l)&&/徒歩/.test(l));
  if(acc){ const m=acc.replace(/^(交通|最寄り?駅|アクセス)[\s:：]*/,'').match(/^(.*?)線?\s*[「『]?([^\s「『」』]+?)[」』]?駅\s*徒歩\s*約?\s*(\d+)\s*分/); if(m){ out.line=m[1].trim(); out.station=m[2]; out.walk=m[3]; } }
  if(out.kind && !/^売/.test(out.kind)){ out.kind = /土地|売地/.test(out.kind)?'売土地':/戸建|一戸建/.test(out.kind)?'売戸建':/区分/.test(out.kind)?'売区分マンション':/マンション/.test(out.kind)?'売マンション':/アパート/.test(out.kind)?'売アパート':out.kind; }
  if(!out.price){ const m=zen2han(text).match(/([\d,.]+\s*億\s*[\d,]*\s*万?|[\d,.]+\s*万)\s*円/); if(m) out.price=m[1]; }
  return out;
}

/* ---------- PDF ---------- */
let pdfjsP=null;
function loadPdfjs(){
  if(pdfjsP) return pdfjsP;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  const load=src=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('pdfjs')); document.head.appendChild(s); });
  pdfjsP = load(base+'pdf.min.js').then(()=>load(base+'pdf.worker.min.js')).then(()=>window.pdfjsLib);
  pdfjsP.catch(()=>{ pdfjsP=null; });
  return pdfjsP;
}
async function readPdf(blob, maxImgs){
  const lib=await loadPdfjs();
  const doc=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer()), isEvalSupported:false}).promise;
  let text=''; const imgs=[];
  for(let i=1;i<=Math.min(doc.numPages,6);i++){
    const pg=await doc.getPage(i);
    try{ const tc=await pg.getTextContent(); text+=tc.items.map(t=>t.str+(t.hasEOL?'\n':'')).join('')+'\n'; }catch(e){}
    if(imgs.length<maxImgs){
      const v0=pg.getViewport({scale:1}); const sc=Math.min(3, 1800/Math.max(v0.width,v0.height));
      const vp=pg.getViewport({scale:sc}); const c=document.createElement('canvas'); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:ctx, viewport:vp}).promise;
      const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.88)); if(b) imgs.push(b);
    }
  }
  return {text, imgs};
}

/* ---------- AI 読み取り ---------- */
const AI_PROMPT = (n, text) => `あなたは日本の不動産仲介会社の事務担当です。他社（元付業者）からLINE・メールで届いた物件資料を、自社の「物件概要書」の項目に転記してください。
添付画像は物件資料（販売図面・物件概要書・PDFのページ・写真）です。${n?`画像は${n}枚あります。`:'画像はありません。'}下のテキストはメッセージ本文とPDFから抽出した文字です（文字化けしている場合は画像を優先）。

出力はJSONオブジェクトのみ。キーと書き方：
- kind: 種別。「売土地」「売戸建」「売マンション」（一棟）「売区分マンション」「売アパート」「売ビル」「売店舗・事務所」のいずれか
- name: 物件名（無ければ「町名＋種別」例「香椎駅前2丁目 中古戸建」）
- addrDisplay: 住居表示 / addrLot: 地番（資料に「所在地」しか無ければ addrDisplay に）
- line: 路線名（例「JR筑肥線」） / station: 駅名（「駅」を除く） / walk: 徒歩分数（数字のみ）
- price: 価格を円の整数（例 1億8,500万円 → 185000000） / taxNote: 「税込」「税別」「非課税」など
- landRegArea: 土地面積（公簿）㎡の数字のみ / landActArea: 実測㎡の数字のみ（記載なし・0なら ""）
- landCategory: 地目 / landCurrent: 土地の現況（更地・建付地・古家付など）
- roads: 接道の配列（最大3件） [{"dir":"方位","type":"公道か私道","width":"幅員mの数字","frontage":"間口mの数字"}]
- cityPlan: 都市計画（市街化区域など） / zoning: 用途地域 / coverage: 建ぺい率（例「60%」） / far: 容積率 / rights: 権利内容 / shape: 形状 / legalLimits: その他法令上の制限（高度地区・防火地域など）
- structure: 構造規模（例「鉄筋コンクリート造陸屋根4階建」） / floorArea: 延床面積（区分なら専有面積）㎡の数字のみ / built: 竣工年月（資料の表記どおり） / use: 用途 / units: 総戸数（例「9戸」） / bldCurrent: 建物の現況（賃貸中・空家など）
- designer: 設計会社 / builder: 施工会社 / parking: 駐車場 / bldOther: 建物その他
- elec: 電気 / gas: ガス / water: 上下水道 / drain: 雑排水 / ev: エレベーター / equipOther: 設備その他
- landPrice, bldPrice, landEval, bldEval: 土地・建物の価格と評価額（円の整数）
- rentFull: 満室想定賃料（年額・円の整数） / rentNow: 現況賃料（年額・円の整数。月額しか無ければ12倍）
- yieldFull, yieldNow: 表面利回り（例「5.98%」） / propTax: 固都税（年額・円の整数） / mgmtCost: 保守管理費（年額・円の整数） / netFull, netNow: ネット利回り
- occFull, occNow: 稼働率（例「99.05%」）
- remarks: 備考の配列（1項目1要素、先頭の※は不要。戸数内訳・改修履歴・告知事項・私道負担・調査の有無・手数料や広告可否など）
- delivCond: 引渡し条件（現況渡し等） / delivTime: 引渡し時期
- dealType: 取引態様 / sender: 資料を送ってきた業者名・担当者

ルール：資料に無い項目は空文字 ""（roads と remarks は空配列）。推測で埋めない。

本文・抽出テキスト：
"""
${text.slice(0,15000) || '（なし）'}
"""`;
async function runAi(){
  if(!cur) return;
  const msg=$('#dAiMsg'); msg.className='ai-msg';
  formToCur();
  const btn=$('#dAi'); btn.disabled=true;
  try{
    const maxImgs = sample && imgLimits ? imgLimits.maxCount : 0;
    const imgs=[]; let pdfText='';
    for(const f of cur.files||[]){
      try{
        if(f.type==='application/pdf'){
          msg.textContent=`${f.name} を読み込み中…`;
          const r=await readPdf(await store.blob(f), Math.max(0, Math.min(4, maxImgs-imgs.length)));
          pdfText+=`\n--- ${f.name} ---\n`+r.text; imgs.push(...r.imgs);
        }else if(imgs.length<maxImgs && imgLimits.mediaTypes.includes(f.type)){
          imgs.push(await store.blob(f));
        }
      }catch(e){ msg.textContent=`${f.name} を読めませんでした。続行します…`; }
    }
    const text=[cur.sourceText||'', pdfText].join('\n').trim();
    if(!sample){
      const n=applyResult(extractByLabels(text));
      msg.textContent = n ? `${n}項目を本文から入力しました。紫の下線が変更箇所です。確認して保存してください。` : '本文に「価格：」「所在地：」などの見出しが見つかりませんでした。概要書に直接入力してください。';
      return;
    }
    if(!imgs.length && !text){ msg.textContent='読み取る資料がありません。資料を追加するか原文を貼り付けてください。'; msg.className='ai-msg err'; return; }
    aiCtl = new AbortController(); $('#dStop').hidden=false;
    msg.textContent='AIが資料を読んでいます…（30秒〜1分ほど）';
    const opts={signal:aiCtl.signal}; if(imgs.length) opts.images=imgs;
    const res = await sample.json(AI_PROMPT(imgs.length, text), opts);
    if(!cur) return;
    if(!res || typeof res!=='object' || Array.isArray(res)) throw {code:'invalid_json'};
    const n=applyResult(res);
    msg.textContent = n ? `${n}項目を読み取りました。紫の下線が変更箇所です。確認して「保存」を押してください。` : '新しく読み取れる項目はありませんでした。';
    if(n){ cur.history=(cur.history||[]).concat({at:stamp(), text:`AI読み取り（${n}項目）`}); renderHist(); }
  }catch(e){
    const c=e&&e.code;
    msg.className = c==='cancelled' ? 'ai-msg' : 'ai-msg err';
    msg.textContent = ({
      cancelled:'読み取りを停止しました。',
      not_granted:'AIの利用が許可されていません。見出し付きの本文なら「本文から自動入力」を使えます。',
      sampling_disabled:'このアカウントではAI読み取りを使えません。',
      rate_limited:'AIの利用が混み合っています。少し時間をおいてもう一度押してください。',
      image_rejected:'読み取れない画像がありました。JPEG・PNGで取り込み直してください。',
      prompt_too_large:'資料が大きすぎます。ページ数の少ないPDFに分けてください。',
      invalid_json:'読み取り結果を項目に変換できませんでした。もう一度押してください。',
      refused:'この資料は読み取れませんでした。',
      session_expired:'ログインが切れました。再読み込みしてください。',
    })[c] || 'AI読み取りに失敗しました。もう一度押してください。';
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){ sample=null; $('#dAi').textContent='本文から自動入力'; }
  }finally{
    btn.disabled=false; $('#dStop').hidden=true; aiCtl=null;
  }
}
$('#dAi').onclick=runAi;

  let items = filtered();
  if(S.status && S.status!=='__due') items=items.filter(p=>(p.status||'new')===S.status);
  items = items.filter(p=>mapQuery(p));
  if(!items.length){ toast('所在地が入っている物件がありません'); return; }
  const head=['物件名','住所','緯度','経度','種別','価格','利回り','進捗','担当','次にやること','GoogleマップURL'];
  const rows=items.map(p=>{ const f=p.f||{}, c=pinCoords(p.mapPin);
    return [displayName(p), f.addrDisplay||(f.addrLot||'').split(/[、,，]/)[0], c?c.lat:'', c?c.lng:'', f.kind, man(f.price), f.yieldFull, (ST[p.status]||ST.new).label, p.assignee, p.next, mapUrl(p)]; });
  const csv='\uFEFF'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
  const name=`物件地図_${today()}.csv`;
  if(downloads){
    try{ await downloads.save({filename:name, data:csv}); toast(`${items.length}件を書き出しました。Google マイマップの「インポート」で読み込めます`); }
    catch(e){ if(e&&e.code!=='declined') toast('書き出せませんでした'); }
  }else{
    try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name; a.click(); toast(`${items.length}件を書き出しました`); }
    catch(e){ toast('このページでは書き出せません'); }
  }
};

/* ---------- 起動 ---------- */
async function init(){
  render();
  let db=null, assets=null;
  if(window.claude && typeof window.claude.use==='function'){
    [db, assets, sample, downloads] = await Promise.all(['db','assets','sample','downloads'].map(n=>window.claude.use(n).catch(()=>null)));
  }
  if(sample){ try{ imgLimits=(await sample.limits()).images||null; }catch(e){ imgLimits=null; } }
  store = db ? makeCloud(db, assets) : await makeLocal();
  $('#mode').textContent = {cloud:'共有データ（社内で同期）', local:'このブラウザに保存', memory:'一時保存（再読み込みで消えます）'}[store.mode];
  if(!store.canUpload){ $('#btnIntake').hidden=true; }
  store.subscribe(items=>{ S.items=items; S.loaded=true; render(); });
}
init();
})();
</script>
